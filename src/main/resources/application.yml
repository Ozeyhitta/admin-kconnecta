spring:
  application:
    name: kconnecta.admin.backend

  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 15000

  jpa:
    hibernate:
      ddl-auto: validate  # DEPLOY NOTE: schema must match entities. Run `ddl-auto: update` once in dev to align, then switch back.
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        jdbc:
          time_zone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
    show-sql: false
    open-in-view: false

  h2:
    console:
      enabled: false

  jackson:
    time-zone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}

  main:
    banner-mode: off

server:
  port: ${PORT:8082}

jwt:
  secret: ${ADMIN_JWT_SECRET}  # Required — separate secret from User backend; app fails to start if missing
  expiration: ${JWT_EXPIRATION:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://admin-kconnecta.vercel.app,https://admin-k-connecta.vercel.app}

logging:
  level:
    org.springframework: warn
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

user-service:
  url: ${USER_SERVICE_URL:http://localhost:8080}
  internal-key: ${INTERNAL_API_KEY}  # Required — no default allowed

admin:
  bootstrap:
    key: ${ADMIN_BOOTSTRAP_KEY:}  # Set to a strong secret before first /init call; leave blank to disable endpoint

gemini:
  api-key: ${GEMINI_API_KEY:}

info:
  app:
    name: ${spring.application.name}
    description: KConnecta Admin Backend API
