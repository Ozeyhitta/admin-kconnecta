spring:
  application:
    name: kconnecta.admin.backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 15000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        jdbc:
          time_zone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
    show-sql: true
    open-in-view: false

  jackson:
    time-zone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}

  main:
    banner-mode: off

server:
  port: ${PORT:8082}

jwt:
  secret: ${JWT_SECRET:kconnecta-super-secret-key-that-is-at-least-256-bits-long-for-hs256}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://admin-kconnecta.vercel.app,https://admin-k-connecta.vercel.app}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

user-service:
  url: ${USER_SERVICE_URL:http://localhost:8080}
  internal-key: ${INTERNAL_API_KEY:kconnecta-internal-secret}

info:
  app:
    name: ${spring.application.name}
    description: KConnecta Admin Backend API
